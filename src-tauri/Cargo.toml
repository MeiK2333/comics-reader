[package]
name = "comics-reader"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "comics_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` backs the asset protocol used to load cached images.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Derives the command error type in `src/error.rs`.
thiserror = "2"
# Fetches page images in Rust. `rustls-tls` avoids a system OpenSSL dependency
# on Linux; `http2` keeps CDN connections efficient.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
# Direct rustls access for ECH-enabled TLS. `ring` is shared with
# reqwest/hickory; `aws-lc-rs` provides the HPKE suites rustls requires for
# ECH. Both providers end up in the binary, so startup installs ring as the
# process default and ECH builds use aws-lc-rs explicitly.
rustls = { version = "0.23", default-features = false, features = ["ring", "aws-lc-rs", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "aws-lc-rs", "tls12", "logging"] }
# Root store for the direct rustls ECH handshake; matches the webpki roots
# already used by reqwest and hickory.
webpki-roots = "1"
# Cache filenames are SHA-256 of the URL; `hex` renders the digest.
sha2 = "0.10"
hex = "0.4"
# Async file I/O for the cache, plus the TCP/TLS and timers used by the ECH
# handshake probe. `sync` serializes lazy ECH config refreshes; `macros`/`rt`
# also cover the ignored DoH network test.
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
url = "2"
# Queries the HTTPS RR of `cloudflare-ech.com` over DoH. `https-ring` enables
# DoH with rustls (same crypto backend as reqwest); `webpki-roots` supplies a
# fixed trust store so the query does not depend on the OS certificate store.
hickory-resolver = { version = "0.26", default-features = false, features = ["https-ring", "webpki-roots"] }
# Encodes the raw ECHConfigList bytes as the base64 presentation format.
# hickory's own Display wraps the value in SVCB presentation quotes.
data-encoding = "2"
# HTML/JSON parsing for platform search and detail pages.
scraper = "0.29"
regex = "1"
html-escape = "0.3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
