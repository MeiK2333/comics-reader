[package]
name = "comics-reader"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "comics_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` backs the asset protocol used to load cached images.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Derives the command error type in `src/error.rs`.
thiserror = "2"
# Fetches page images in Rust. `rustls-tls` avoids a system OpenSSL dependency
# on Linux; `http2` keeps CDN connections efficient.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
# Cache filenames are SHA-256 of the URL; `hex` renders the digest.
sha2 = "0.10"
hex = "0.4"
# Async file I/O for reading and writing the on-disk cache.
tokio = { version = "1", features = ["fs"] }
url = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
